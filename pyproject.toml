[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperbench-harbor"
version = "0.1.0"
description = "Harbor adapters for PaperWritingBench and PaperWrite-Bench"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "a-green-hand-jack" },
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
datasets = [
  "datasets>=3.0",
  "huggingface-hub>=0.25",
  "Pillow>=10.0",
]
trials = [
  "huggingface-hub>=0.25",
]
harbor = [
  "harbor==0.22.0",
  "huggingface-hub>=0.25",
]
sidecar = [
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "requests>=2.0",
  "thefuzz>=0.22",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
paperbench-harbor = "paperbench_harbor.cli:app"

[project.entry-points."harbor.plugins"]
paperbench-trial-export = "paperbench_harbor.trials.orchestrator:SanitizedTrialExportPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/paperbench_harbor"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/paperbench_harbor/vendor"]
