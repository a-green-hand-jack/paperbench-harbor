name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,trials,sidecar]'
      - name: Lint
        run: ruff check .
      - name: Check documentation references
        run: python scripts/check_documentation_references.py
      - name: Check retired suite remains absent
        run: test ! -e tests
