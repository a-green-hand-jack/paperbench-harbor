name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,trials,sidecar]'
      - name: Lint
        run: ruff check .
      - name: Build installed distribution
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Check retired suite remains absent
        run: test ! -e tests && test ! -e scripts && test ! -e .opencode/agent
